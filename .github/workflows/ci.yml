name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  LLM_MODE: mock

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with a coverage floor
        run: npm run coverage
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose build test
      - name: Lint and type-check
        run: docker compose run --rm --no-deps test sh -c "ruff check . && ruff format --check . && mypy app"
      - name: Tests
        run: docker compose run --rm test pytest
      - name: Retrieval evals
        run: docker compose run --rm test python -m evals.retrieval --check

  supply-chain:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: pip-audit on the locked runtime dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps

  stack:
    name: Build images and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 240
      - run: curl -fsS http://localhost:8080/readyz
      - name: Scan images (fail on fixable high or critical)
        run: |
          for image in placement_rag-backend placement_rag-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.1 \
              image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image:latest"
          done
      - name: Browser tests
        run: docker compose --profile e2e run --rm e2e sh -c "npm ci --no-audit --no-fund && npx playwright test --project=flows"
      - name: Logs
        if: failure()
        run: docker compose logs --tail 200
