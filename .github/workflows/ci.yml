name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  LLM_MODE: mock

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose build test
      - name: Lint and type-check
        run: docker compose run --rm --no-deps test sh -c "ruff check . && ruff format --check . && mypy app"
      - name: Tests
        run: docker compose run --rm test pytest
      - name: Retrieval evals
        run: docker compose run --rm test python -m evals.retrieval --check

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 240
      - run: curl -fsS http://localhost:8080/readyz
