name: Uptime

# Checks the live site every 15 minutes. A failed run makes GitHub email the repository owner.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://placementrag.indiasouthcentral.cloudapp.azure.com
    steps:
      - name: API is ready
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 20 "$SITE/readyz"
      - name: Pages load over HTTPS with a valid certificate
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 20 -o /dev/null "$SITE/"
