name: placement_rag

x-backend: &backend
  image: placement_rag-backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-placement}:${POSTGRES_PASSWORD:-placement}@db:5432/${POSTGRES_DB:-placement}
    LLM_MODE: ${LLM_MODE:-mock}
    SEED_DEMO: ${SEED_DEMO:-1}
    DEV_EMAIL_DOMAINS: ${DEV_EMAIL_DOMAINS:-example.com}
  volumes:
    - rawfiles:/data/raw

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placement}
      POSTGRES_DB: ${POSTGRES_DB:-placement}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    image: placement_rag-frontend
    build:
      context: frontend
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    <<: *backend
    image: placement_rag-test
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      <<: *backend-env
      LLM_MODE: mock
      RUN_LIVE_LLM: ${RUN_LIVE_LLM:-0}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/srv/backend-src
      - ./evals:/srv/evals
      - ./docs:/srv/docs

volumes:
  pgdata:
  rawfiles:
