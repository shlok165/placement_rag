name: placement_rag

x-backend: &backend
  image: placement_rag-backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-placement}:${POSTGRES_PASSWORD:-placement}@db:5432/${POSTGRES_DB:-placement}
    LLM_MODE: ${LLM_MODE:-mock}
    SEED_DEMO: ${SEED_DEMO:-1}
    DEV_EMAIL_DOMAINS: ${DEV_EMAIL_DOMAINS:-example.com}
  volumes:
    - rawfiles:/data/raw

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placement}
      POSTGRES_DB: ${POSTGRES_DB:-placement}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -1 | grep -q ."]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  frontend:
    image: placement_rag-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    <<: *backend
    image: placement_rag-test
    profiles: ["test"]
    user: root
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      <<: *backend-env
      LLM_MODE: ${TEST_LLM_MODE:-mock}
      RUN_LIVE_LLM: ${RUN_LIVE_LLM:-0}
      MYPY_CACHE_DIR: /tmp/mypy
      RUFF_CACHE_DIR: /tmp/ruff
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/srv/app
      - ./backend/tests:/srv/tests
      - ./backend/pyproject.toml:/srv/pyproject.toml
      - ./evals:/srv/evals
      - ./docs:/srv/docs

  frontend-test:
    image: placement_rag-frontend-test
    profiles: ["test"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: test

  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["e2e"]
    working_dir: /e2e
    environment:
      BASE_URL: http://frontend:8080
      CI: "1"
    depends_on:
      frontend:
        condition: service_healthy
      worker:
        condition: service_healthy
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    ipc: host
    volumes:
      - ./e2e:/e2e
      - ./docs/img:/img

volumes:
  pgdata:
  rawfiles:
